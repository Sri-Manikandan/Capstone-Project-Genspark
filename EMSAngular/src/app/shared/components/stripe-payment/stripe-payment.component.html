    <div class="space-y-4">
      <div id="payment-element"></div>
      <p *ngIf="errorMessage()" class="text-sm text-rose">{{ errorMessage() }}</p>
      <button type="button" (click)="pay()" [disabled]="submitting()" class="btn-primary w-full">
        {{ submitting() ? 'Processing…' : 'Pay now' }}
      </button>
    </div>
