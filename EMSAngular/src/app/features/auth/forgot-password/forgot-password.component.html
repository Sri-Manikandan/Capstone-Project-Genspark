    <div class="mx-auto max-w-sm">
      <div class="card p-7">
        <p class="eyebrow text-plum">Lost your way in?</p>
        <h1 class="mt-2 font-display text-2xl font-semibold text-ink">Reset password</h1>
        <p class="mt-1 mb-5 text-sm text-muted">Enter your email and we'll send you a reset link.</p>
        <ems-alert [type]="messageType()" [message]="message()" (dismissed)="message.set('')" />
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
          <label class="block space-y-1">
            <span class="field-label">Email</span>
            <input formControlName="email" type="email" placeholder="you@example.com" class="field" />
            <ems-field-error [control]="form.controls.email" label="Email" />
          </label>
          <button type="submit" class="btn-primary w-full">Send reset link</button>
        </form>
      </div>
    </div>
