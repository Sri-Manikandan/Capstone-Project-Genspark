# Routes /ai/* on the shared API hostname to the chatbot service.
#
# A separate Ingress (rather than a path on ems-api's) because SSE needs
# proxy-buffering off, and annotations apply per-Ingress — we don't want to
# change buffering for the whole API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ems-chatbot
  namespace: ems
  annotations:
    # SSE: hold the stream open and flush frames immediately.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # No cert-manager annotation here: ems-api's Ingress owns issuance of the
    # ems-api-tls certificate for this host; this Ingress only references it.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __INGRESS_FQDN__
      secretName: ems-api-tls
  rules:
    - host: __INGRESS_FQDN__
      http:
        paths:
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ems-chatbot
                port:
                  number: 80
