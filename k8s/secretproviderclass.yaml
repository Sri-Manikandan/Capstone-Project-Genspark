# Pulls secrets from Key Vault via the Secrets Store CSI driver and syncs them into a
# Kubernetes Secret named ems-secrets, which the Deployments consume with envFrom.
#
# The `key` names are the .NET environment-variable forms: "__" maps to ":" in .NET
# configuration, so ConnectionStrings__Default populates ConnectionStrings:Default.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ems-keyvault
  namespace: ems
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "__WORKLOAD_IDENTITY_CLIENT_ID__"
    keyvaultName: "__KEYVAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: db-connection-string
          objectType: secret
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: stripe-secret-key
          objectType: secret
        - |
          objectName: stripe-webhook-secret
          objectType: secret
        - |
          objectName: resend-api-key
          objectType: secret
  secretObjects:
    - secretName: ems-secrets
      type: Opaque
      data:
        - objectName: db-connection-string
          key: ConnectionStrings__Default
        - objectName: jwt-key
          key: Jwt__Key
        - objectName: stripe-secret-key
          key: Stripe__SecretKey
        - objectName: stripe-webhook-secret
          key: Stripe__WebhookSecret
        - objectName: resend-api-key
          key: Email__ApiKey
