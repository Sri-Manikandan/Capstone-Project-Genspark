# Pulls secrets from Key Vault via the Secrets Store CSI driver and syncs them into a
# Kubernetes Secret named ems-secrets, which the Deployments consume with envFrom.
#
# The `key` names are the .NET environment-variable forms: "__" maps to ":" in .NET
# configuration, so ConnectionStrings__Default populates ConnectionStrings:Default.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ems-keyvault
  namespace: ems
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "__WORKLOAD_IDENTITY_CLIENT_ID__"
    keyvaultName: "__KEYVAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: db-connection-string
          objectType: secret
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: stripe-secret-key
          objectType: secret
        - |
          objectName: stripe-webhook-secret
          objectType: secret
        - |
          objectName: resend-api-key
          objectType: secret
        # WARNING: the CSI driver mounts this whole list atomically — if ANY object here
        # cannot be retrieved from Key Vault, the volume mount fails and ems-api/ems-worker
        # crash-loop entirely (not just the feature that needed it). Before adding an object
        # or deploying this file to an already-provisioned environment, run
        # scripts/provision.sh so the secret exists in Key Vault first.
        - |
          objectName: storage-connection-string
          objectType: secret
        # Presidio LLM gateway token for ems-chatbot. Must exist in Key Vault before
        # this manifest is applied (same atomic-mount rule as above).
        - |
          objectName: anthropic-auth-token
          objectType: secret
  secretObjects:
    - secretName: ems-secrets
      type: Opaque
      data:
        - objectName: db-connection-string
          key: ConnectionStrings__Default
        - objectName: jwt-key
          key: Jwt__Key
        - objectName: stripe-secret-key
          key: Stripe__SecretKey
        - objectName: stripe-webhook-secret
          key: Stripe__WebhookSecret
        - objectName: resend-api-key
          key: Email__ApiKey
        # Must already exist in Key Vault before this manifest is applied — see the
        # warning above the `objects` array.
        - objectName: storage-connection-string
          key: Storage__ConnectionString
    # Python-style env-var names for ems-chatbot (pydantic-settings). jwt-key is
    # deliberately shared with the API: the chatbot validates the same HS256 tokens
    # the API mints.
    - secretName: chatbot-secrets
      type: Opaque
      data:
        - objectName: anthropic-auth-token
          key: ANTHROPIC_AUTH_TOKEN
        - objectName: jwt-key
          key: JWT_SIGNING_KEY
