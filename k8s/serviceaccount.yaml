# The name and namespace here MUST exactly match the federated credential subject in
# infra/main.bicep: system:serviceaccount:ems:ems-sa
# A mismatch fails at token exchange with an error that reads like an RBAC problem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ems-sa
  namespace: ems
  annotations:
    azure.workload.identity/client-id: "__WORKLOAD_IDENTITY_CLIENT_ID__"
  labels:
    azure.workload.identity/use: "true"
