<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#0f1115;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f1115;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#181b22;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #262a33;">
              <span style="color:#e8eaed;font-size:18px;font-weight:600;">EventHub</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#c8ccd4;font-size:15px;line-height:1.6;">
              {{Body}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #262a33;color:#6b7280;font-size:12px;">
              This is an automated message from EventHub. Please do not reply.<br>
              &copy; {{Year}} EventHub
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
