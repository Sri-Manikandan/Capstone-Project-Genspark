<h1 style="margin:0 0 16px;color:#e8eaed;font-size:22px;">{{EventTitle}} has moved</h1>
<p style="margin:0 0 24px;">Hi {{Name}}, the screening for your booking {{BookingReference}} has been rescheduled. Your ticket is still valid &mdash; the same QR works.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;background:#12151b;border-radius:8px;">
  <tr><td style="padding:16px;color:#9aa1ad;font-size:13px;">Was</td><td style="padding:16px;color:#9aa1ad;text-decoration:line-through;" align="right">{{OldTime}}</td></tr>
  <tr><td style="padding:0 16px 16px;color:#9aa1ad;font-size:13px;">Now</td><td style="padding:0 16px 16px;color:#e8eaed;font-weight:600;" align="right">{{NewTime}}</td></tr>
  <tr><td style="padding:0 16px 16px;color:#9aa1ad;font-size:13px;">Where</td><td style="padding:0 16px 16px;color:#e8eaed;" align="right">{{VenueName}}</td></tr>
</table>
<a href="{{AppUrl}}/bookings" style="display:inline-block;padding:12px 20px;background:#6366f1;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;">View booking</a>
